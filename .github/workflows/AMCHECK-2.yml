name: "AMCHECK 2"

on:
  #push:
  #  branches: main
  #  paths:
  #    - results/*
  #    - .github/workflows/AMCHECK.yml

  repository_dispatch:
    types: [check]

  workflow_dispatch:
    inputs:
      reset_stats:
        description: "RESET stats"
        required: true
        default: false
        type: boolean
      retest_excluded:
        description: "TEST excluded"
        required: true
        default: false
        type: boolean
      what_test:
        description: "App names: (space between)"
        required: false
        default: ""
        type: string
      how_many:
        description: "Apps per run (default: MAX_JOBS x APPS_PER_JOB)"
        required: false
        default: ""
        type: string

  #schedule:
  #  - cron: '13,43 * * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

env:
  REPO: ${{ github.repository_owner }}/AM
  MAX_JOBS: 20          # parallel jobs; match your plan's concurrency limit
  APPS_PER_JOB: 30      # apps tested sequentially inside each job
  APP_TIMEOUT: 600      # per-app install timeout (seconds)
  SLOW_APPS: ""         # apps allowed 1800s, e.g. "bigapp otherapp"
  RETEST: "true"        # rotation: retest oldest-tested apps when nothing is left
  CHAIN: "false"        # 'true' + CHAIN_PAT secret = chain next wave on schedule

jobs:
  prepare:
    name: "prepare 🌀"
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.wave.outputs.skip || steps.reset.outputs.skip }}
      matrix: ${{ steps.wave.outputs.matrix }}
      all: ${{ steps.wave.outputs.all }}
    env:
      RESET: ${{ github.event.inputs.reset_stats || '' }}
      WHAT_TEST: ${{ github.event.inputs.what_test || '' }}
      RETEST_EXCLUDED: ${{ github.event.inputs.retest_excluded || '' }}
      HOW_MANY: ${{ github.event.inputs.how_many || '' }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Checkout AM"
        if: env.RESET != 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.REPO }}
          path: am-src

      - name: "Count programs 📊"
        if: env.RESET != 'true'
        run: |
          sort am-src/programs/x86_64-apps | grep -v "\"kdegames\"\|\"kdeutils\"\|\"node\"\|\"platform-tools\"\| ffwa-\|am-utils" | awk '{print $2}' | sort -u > appslist
          echo "Catalog: $(wc -l < appslist) apps"

      - name: "Reset stats"
        id: reset
        if: env.RESET == 'true'
        run: |
          git config --global user.name web-flow
          git config --global user.email "noreply@github.com"
          rm -rf results
          git rm -rq --ignore-unmatch results
          if ! git diff --cached --quiet; then
            git commit -m "reset stats"
            git push
          fi
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "### stats RESET" >> $GITHUB_STEP_SUMMARY

      - name: "Build wave 🏆"
        id: wave
        if: env.RESET != 'true'
        run: |
          set -e
          mkdir -p results
          touch results/tested results/excluded
          sort -u results/excluded -o results/excluded
          total=$(wc -l < appslist)

          # normalize legacy tested files (plain names -> "epoch name", epoch 0 = oldest)
          awk 'NF==1 {print 0, $1; next} {print}' results/tested > results/tested.tmp
          mv results/tested.tmp results/tested
          awk '{print $2}' results/tested | sort -u > tested.names
          cp results/excluded excluded.names

          comm -23 appslist tested.names | comm -23 - excluded.names > never.list
          sort -n results/tested | awk '!seen[$2]++ {print $2}' | sort > retest.all
          comm -12 retest.all appslist | comm -23 - excluded.names > retest.list

          PER_RUN=$(( MAX_JOBS * APPS_PER_JOB ))
          if [ -n "$HOW_MANY" ] && [ "$HOW_MANY" -gt 0 ] 2>/dev/null; then
            PER_RUN=$HOW_MANY
          fi
          MAX_APPS=$(( 250 * APPS_PER_JOB ))   # stay under the 256-jobs matrix cap
          [ "$PER_RUN" -gt "$MAX_APPS" ] && PER_RUN=$MAX_APPS

          if [ -n "$WHAT_TEST" ]; then
            echo "$WHAT_TEST" | tr ' ' '\n' | sed '/^$/d' > wave.list
          elif [ "$RETEST_EXCLUDED" == "true" ]; then
            head -n "$PER_RUN" excluded.names > wave.list
          else
            head -n "$PER_RUN" never.list > wave.list
            if [ "$RETEST" == "true" ]; then
              need=$(( PER_RUN - $(wc -l < wave.list) ))
              [ "$need" -gt 0 ] && head -n "$need" retest.list >> wave.list
            fi
          fi

          if [ ! -s wave.list ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "### 🏁 Nothing to test" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          mkdir -p chunks
          split -l "$APPS_PER_JOB" -d -a 2 wave.list chunks/chunk
          MATRIX='{"include":['
          for f in chunks/chunk-*; do
            MATRIX+="{\"chunk\":\"${f##*/chunk-}\"},"
          done
          MATRIX="${MATRIX%,}]}"
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT
          echo "all=$total" >> $GITHUB_OUTPUT

          tested=$(wc -l < tested.names)
          excluded=$(wc -l < excluded.names)
          {
            echo "### 🎬 apps: $total"
            echo "🏁 tested: $tested"
            echo "❌ excluded: $excluded"
            echo "🔨 this wave: $(wc -l < wave.list) apps in $(ls chunks/chunk-* | wc -l) jobs"
          } >> $GITHUB_STEP_SUMMARY

      - name: "Upload wave chunks"
        if: env.RESET != 'true' && steps.wave.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: chunks
          path: chunks
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: "Upload appslist"
        if: env.RESET != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: appslist
          path: appslist
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  run-actions:
    name: "🔨"
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # keep: APPS_PER_JOB * (APP_TIMEOUT / 60) + 15 <= 360
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: "Checkout AM"
        uses: actions/checkout@v7
        with:
          repository: ${{ env.REPO }}

      - name: "Dependencies"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnotify-bin ripgrep

      - name: "Fix AppArmor"
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: "Install AM manually 🎁"
        run: |
          sudo mkdir -p /opt/am/modules /usr/local/bin || exit 1
          sudo cp -r ./APP-MANAGER /opt/am/APP-MANAGER && sudo chmod a+x /opt/am/APP-MANAGER || exit 1
          sudo ln -fs /opt/am/APP-MANAGER /usr/local/bin/am || exit 1
          sudo touch /opt/am/remove || exit 1
          sudo cp -r modules/*.am /opt/am/modules/
          export AMDATADIR="${XDG_DATA_HOME:-$HOME/.local/share}"/AM
          mkdir -p "$AMDATADIR" || exit 1
          cp -r programs/x86_64-apps "$AMDATADIR"/ || exit 1

      - name: "Download chunks"
        uses: actions/download-artifact@v8
        with:
          name: chunks
          path: chunks

      - name: "Test batch ${{ matrix.chunk }} 🚧"
        working-directory: programs/x86_64
        run: |
          set -uo pipefail
          mkdir -p results

          test_one() {
            APP="$1"
            LOG="results/log-$APP"
            OUT="results/out-$APP"
            pure_arg=$(echo "$APP" | sed 's/-appimage$//g; s:.*/::')

            echo "APP=\"$APP\"" > "$OUT"
            if grep -qe "appimage-extract\|mage\$\|tmp/\*mage" "$APP" 1>/dev/null; then
              echo "APPIMAGE='yes'" | tee -a "$OUT"
            else
              echo "APPIMAGE='no'" >> "$OUT"
            fi
            if grep -q "api.github.com" "$APP" 2>/dev/null; then
              echo "GITHUB='yes'" | tee -a "$OUT"
            else
              echo "GITHUB='no'" >> "$OUT"
            fi
            if grep -q "^SITE=" "$APP" 2>/dev/null; then
              SITE=$(eval echo "$(grep -i '^SITE=' "$APP" | head -1 | sed 's/SITE=//g')")
              echo "SITE=\"$SITE\"" | tee -a "$OUT"
            fi

            sed -i '/command -v "$pure_arg"/d; /command already exists/d' /opt/am/modules/install.am
            if [[ "$pure_arg" =~ (node|npm) ]]; then
              sed -i 's/_check_if_script_installs_a_metapackage || return 1//g' /opt/am/modules/install.am
            fi

            #########################
            # INSTALL THE APPLICATION
            #########################

            if [[ "$pure_arg" =~ (animashooter-junior|animashooter-pioneer|kiwix|ryujinx|ryujinx-canary) ]]; then
              echo "This application cannot be installed on GitHub Actions due to slow download URL or a too weak domain" | tee -a "$LOG"
              echo "$APP" >> "results/ok-$APP"
              return 0
            elif [[ "$pure_arg" =~ (mudlet|openxcom|openxcom-extended|vhc-viewer-wayland|vhc-viewer-x11) ]]; then
              echo "This application cannot be installed on GitHub Actions" | tee -a "$LOG"
              echo "$APP" >> "results/ok-$APP"
              return 0
            elif [[ "$pure_arg" =~ (koreader-nightly) ]]; then
              echo "This application has a pending issue report" | tee -a "$LOG"
              echo "$APP" >> "results/ok-$APP"
              return 0
            fi

            ANSWER=y
            EXTRA=""
            if grep -qe "^read \|SITE1=" "$APP" 1>/dev/null || [[ "$pure_arg" =~ (wine) ]]; then
              ANSWER=1
            elif [[ "$pure_arg" =~ (bat-extras) ]]; then
              EXTRA="bat"
            fi

            TO="$APP_TIMEOUT"
            for slow in $SLOW_APPS; do [ "$slow" = "$pure_arg" ] && TO=1800; done

            for attempt in 1 2 3; do
              echo "$ANSWER" | timeout "$TO" am -i $EXTRA "$APP" --debug 2>&1
              ARGSNUMB=$(find /opt -maxdepth 2 -name 'remove' -print 2>/dev/null | sed 's|/remove||g' | tr ' ' '\n' | wc -l)
              if [ "$ARGSNUMB" = 1 ]; then
                [ "$attempt" -lt 3 ] && sleep 30
              else
                break
              fi
            done

            LASTDIR=$(ls -td /opt/* | head -1 | sed 's:.*/::')

            if [ "$LASTDIR" = am ]; then
              echo "### 💀 $APP" >> $GITHUB_STEP_SUMMARY
              echo "$APP" | tee -a "$LOG"
              echo "$APP" >> "results/ko-$APP"
              return 1
            elif test -f /opt/"$LASTDIR"/remove; then

              printf "\n-------------------------------------------------------------\n\n"
              echo " Structure of the directory in /opt"
              echo ""
              ls /opt/"$LASTDIR" | tee -a "$LOG"

              printf "\n-------------------------------------------------------------\n\n"
              if compgen -G "/opt/$LASTDIR/icons/*" >/dev/null; then
                mkdir -p "results/icons/$pure_arg"
                cp -r /opt/"$LASTDIR"/icons/* "results/icons/$pure_arg/" 2>/dev/null
              fi

              printf "\n-------------------------------------------------------------\n\n"
              echo " Command in \$PATH"
              echo ""
              command -v "$pure_arg" | tee -a "$LOG" || command -v "$LASTDIR" | tee -a "$LOG" || ls /usr/local/bin | tee -a "$LOG"

              printf "\n-------------------------------------------------------------\n\n"
              echo " Launchers in /usr/local/share/applications" | tee -a "$LOG"
              echo ""
              if [ -n "$(find /usr/local/share/applications/ -type f -name '*AM.desktop' 2>/dev/null)" ]; then
                find /usr/local/share/applications/ -type f -name '*AM.desktop' | tee -a "$LOG"
              else
                echo "No .desktop file available" | tee -a "$LOG"
              fi

              printf "\n-------------------------------------------------------------\n\n"
              if am -R "$LASTDIR"; then
                echo "$APP" >> "results/ok-$APP"
              else
                echo "$APP" >> "results/ko-$APP"
              fi
            else
              echo "$APP" | tee -a "$LOG"
              echo "$APP" >> "results/ko-$APP"
              return 1
            fi
          }

          while IFS= read -r app; do
            [ -z "$app" ] && continue
            echo "########## 🔨 $app"
            test_one "$app" || echo "⚠️ $app FAILED"
            # reset state for the next app (keep /opt/am)
            find /opt -mindepth 1 -maxdepth 1 ! -name am -exec sudo rm -rf {} +
            sudo find /usr/local/share/applications -maxdepth 1 -name '*AM.desktop' -delete 2>/dev/null || true
          done < "$GITHUB_WORKSPACE/chunks/chunk-${{ matrix.chunk }}"

      - name: "Upload wave results ⬆️"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wave-${{ matrix.chunk }}
          path: programs/x86_64/results/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0

  update-results:
    name: "results 📰"
    needs: [prepare, run-actions]
    if: ${{ !cancelled() && needs.prepare.outputs.skip != 'true' && needs.run-actions.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Download wave results ⬇️"
        uses: actions/download-artifact@v8
        with:
          pattern: wave-*
          path: results
          merge-multiple: true

      - name: "Download appslist"
        uses: actions/download-artifact@v8
        with:
          name: appslist
          path: .

      - name: "Process log results"
        run: |
          touch results/tested results/excluded
          shopt -s nullglob
          for OutFile in results/out-*; do
            appname=${OutFile#results/out-}
            echo "== $appname"
            if [ -f "results/ko-$appname" ]; then
              echo "$appname" >> results/excluded
              cat "$OutFile" | grep -E '(^.*=.*$|^.*----.*$)' >> results/log
              { echo '--- last 40 lines of the install log ---'; tail -n 40 "results/log-$appname" 2>/dev/null || true; } >> results/log
              rm -f "results/ko-$appname" "results/out-$appname" "results/log-$appname"
            elif [ -f "results/ok-$appname" ]; then
              echo "$(date +%s) $appname" >> results/tested
              grep -vxF "$appname" results/excluded > results/excluded.tmp || true
              mv results/excluded.tmp results/excluded
              cat "$OutFile" | grep -E '(^.*=.*$|^.*----.*$)' >> results/log
              rm -f "results/ok-$appname" "results/out-$appname" "results/log-$appname"
            else
              echo "⚠️ inconclusive: $appname (will be retried)" | tee -a $GITHUB_STEP_SUMMARY
            fi
          done
          sort -u results/excluded -o results/excluded
          awk 'NF==1 {print 0, $1; next} {print}' results/tested | sort -rn | awk '!seen[$2]++' | sort -n -o results/tested
          rm -rf results/icons
          git add -A results

      - name: "Show results"
        run: |
          total=$(wc -l < appslist)
          tested=$(awk '{print $2}' results/tested | sort -u | wc -l)
          excluded=$(wc -l < results/excluded)
          remaining=$(( total - tested - excluded ))
          (( remaining < 0 )) && remaining=0
          {
            echo "🏁 $tested tested"
            echo "😱 $excluded excluded"
            echo "### 🛅 $remaining to test"
          } >> $GITHUB_STEP_SUMMARY

      - name: "Push"
        run: |
          git config --global user.name web-flow
          git config --global user.email "noreply@github.com"
          case "$GITHUB_REF" in refs/pull/*) exit 0 ;; esac
          if git diff-index --quiet HEAD; then
            echo "No changes to commit." >> $GITHUB_STEP_SUMMARY
          else
            git commit -m "check"
            git push --force-with-lease && echo "sync successful" >> $GITHUB_STEP_SUMMARY || { git diff && git status; }
          fi

      - name: "Chain next wave ↻ (optional)"
        if: ${{ env.CHAIN == 'true' && github.event_name == 'schedule' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CHAIN_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "CHAIN_PAT not set, skipping chain"; exit 0; fi
          total=$(wc -l < appslist)
          tested=$(awk '{print $2}' results/tested | sort -u | wc -l)
          excluded=$(wc -l < results/excluded)
          remaining=$(( total - tested - excluded ))
          if [ "$remaining" -gt 0 ]; then
            gh api repos/${{ github.repository }}/dispatches -f event_type=check
            echo "↻ chained next wave ($remaining apps left)" >> $GITHUB_STEP_SUMMARY
          fi

  all-done:
    name: "all 🏁"
    needs: [prepare, run-actions]
    if: ${{ !cancelled() && needs.prepare.outputs.skip == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: "Nothing to do"
        run: echo "No wave ran (reset or full coverage). See prepare job summary." >> $GITHUB_STEP_SUMMARY
